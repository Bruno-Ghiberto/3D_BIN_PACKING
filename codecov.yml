# Codecov configuration (T038, FR-012, Constitution III).
#
# A single `library` flag tracks coverage on `src/bin_packer_3d/` only —
# `tests/`, `benchmark/`, and `scripts/` are intentionally excluded so the
# floor reflects shipped code, not test scaffolding.
#
# Project target: 90 % line coverage on the library flag, hard-enforced by
# `pytest --cov-fail-under=90` once Phase B (T049) ramps the matrix and
# turns the gate ON in CI. Phase A bootstrap publishes coverage but does
# not block on the floor — the existing 80 % baseline closes during US5/6/7
# test additions.

coverage:
  range: "70...100"

  status:
    project:
      default:
        target: 90%
        threshold: 1%
        flags:
          - library
        if_ci_failed: error
    patch:
      default:
        target: 90%
        threshold: 1%
        flags:
          - library
        if_ci_failed: error

flags:
  library:
    paths:
      - src/bin_packer_3d/
    carryforward: true

comment:
  layout: "header, diff, flags, components, files"
  behavior: default
  require_changes: false

ignore:
  - "tests/"
  - "benchmark/"
  - "scripts/"
  - "docs/"
  - "examples/"
  - "legacy/"
  - "DATASETS/"
