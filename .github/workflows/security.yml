# CodeQL security analysis (T046, FR-014).
#
# Python-only static analysis. Runs on every push to main and on a weekly
# Monday cron so dependency rotations or upstream rule updates surface
# without waiting for the next merge. ADVISORY at v0.2.0 — does not gate
# merges; flagged findings are triaged through the Security tab and folded
# into follow-up issues.

name: Security — CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — same cadence as Dependabot batches.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3.35.2
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3.35.2
        with:
          category: "/language:python"
